name: Update activity art

# Satu workflow, dua generator (snake + pacman), satu kali push ke branch `output`.
# Dijadikan satu supaya dua workflow tidak saling menimpa branch yang sama.

on:
  schedule:
    - cron: "0 */12 * * *"   # tiap 12 jam (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-art
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Generate pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}